<style>/*
 * Ink-and-parchment. Ink field, parchment surfaces, seat colours for sides,
 * aged gold reserved for the things the player is meant to act on — it is the
 * only colour that means "do this", so it never appears as decoration.
 */

:root {
  --ink: #0d0b09;
  --ink-soft: #17130f;
  --ink-line: #2a231c;
  --parchment: #e8dcc0;
  --parchment-dim: #d3c4a2;
  --parchment-deep: #bfae8a;
  --parchment-shadow: #a4906c;
  --gold: #c9a227;
  --gold-bright: #e3bf4a;
  --wax: #8c2f24;

  --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --numeric: 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

  --panel-w: 340px;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
}

body {
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

.app {
  display: grid;
  grid-template-columns: 1fr var(--panel-w);
  height: 100%;
  gap: 0;
}

/* ---------------------------------------------------------------- map ---- */

.map-stage {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, #191410 0%, var(--ink) 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.map-svg {
  height: 100%;
  width: auto;
  max-width: 100%;
  filter: drop-shadow(0 18px 40px rgb(0 0 0 / 0.55));
}

.county {
  cursor: pointer;
  outline: none;
}

.county:hover path:first-of-type {
  filter: brightness(1.08);
}

.county:focus-visible path:nth-of-type(3) {
  stroke: var(--gold-bright);
  stroke-width: 4;
}

.county-selected {
  animation: march 1.4s linear infinite;
}

@keyframes march {
  to {
    stroke-dashoffset: -16;
  }
}

.county-label {
  font-size: 17px;
  font-weight: 600;
  fill: var(--ink);
  letter-spacing: 0.02em;
  paint-order: stroke;
  stroke: rgb(232 220 192 / 0.75);
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.county-sub {
  font-size: 11px;
  fill: #4a3f31;
  letter-spacing: 0.04em;
  paint-order: stroke;
  stroke: rgb(232 220 192 / 0.6);
  stroke-width: 2.5px;
}

.garrison-count {
  font-size: 11px;
  font-weight: 600;
}

/* -------------------------------------------------------------- panel ---- */

.panel {
  background: linear-gradient(180deg, #14100c 0%, #100d0a 100%);
  border-left: 1px solid var(--ink-line);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 0 0 20px;
}

.panel-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--ink-line);
  background: linear-gradient(180deg, #1b1611 0%, #14100c 100%);
}

.panel-title {
  font-size: 21px;
  letter-spacing: 0.04em;
  color: var(--parchment);
}

.panel-turn {
  margin-top: 4px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.panel-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-line);
}

.panel-grow {
  flex: 1 0 auto;
}

.section-heading {
  margin: 0 0 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
}

/* --------------------------------------------------------------- lords --- */

.lord-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.lord {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 3px;
  font-size: 14px;
}

.lord-active {
  background: rgb(201 162 39 / 0.1);
  box-shadow: inset 2px 0 0 var(--gold);
}

.lord-swatch {
  width: 11px;
  height: 11px;
  border-radius: 2px;
  flex: none;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 0.5);
}

.lord-crest {
  flex: none;
  display: block;
}

.resource-icon {
  vertical-align: -3px;
  margin-right: 5px;
}

.stat-with-icon {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 2px;
}

.lord-name {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  flex: 1;
}

.lord-faction {
  font-size: 11px;
  color: var(--parchment-shadow);
}

.lord-meta {
  font-family: var(--numeric);
  font-size: 11px;
  color: var(--parchment-shadow);
}

/* -------------------------------------------------------------- county --- */

.empty-hint {
  margin: 0;
  font-size: 13px;
  color: var(--parchment-shadow);
  font-style: italic;
}

.county-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
}

.county-detail-name {
  font-size: 19px;
  color: var(--parchment);
}

.county-detail-owner {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.stat-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  margin: 0 0 12px;
  align-items: baseline;
}

.stat-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.stat-value {
  margin: 0;
  font-size: 13px;
  color: var(--parchment-dim);
  text-align: right;
  font-family: var(--numeric);
}

.garrison-row,
.neighbour-row {
  padding-top: 10px;
  border-top: 1px solid var(--ink-line);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.garrison-value {
  font-size: 13px;
  color: var(--parchment-dim);
}

.neighbour-list {
  font-size: 12px;
  color: var(--parchment-shadow);
  line-height: 1.45;
}

/* ------------------------------------------------------------ treasury --- */

.treasury {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px 12px;
}

.treasury-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  padding: 2px 0;
}

.treasury-label {
  color: var(--parchment-shadow);
}

.treasury-amount {
  color: var(--gold-bright);
}

.treasury-note {
  margin: 10px 0 0;
  font-size: 11px;
  line-height: 1.5;
  color: var(--parchment-shadow);
  font-style: italic;
}

/* ------------------------------------------------------------- mobile ---- */

@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }

  .panel {
    border-left: none;
    border-top: 1px solid var(--ink-line);
    max-height: 46vh;
  }

  .map-svg {
    height: auto;
    width: 100%;
    max-height: 100%;
  }
}

/* ------------------------------------------------------- battle report --- */

.report-backdrop {
  position: fixed;
  inset: 0;
  background: rgb(8 6 5 / 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 40;
}

.report {
  width: min(860px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #191410 0%, #120f0c 100%);
  border: 1px solid var(--ink-line);
  border-radius: 4px;
  box-shadow: 0 30px 80px rgb(0 0 0 / 0.7);
}

.report-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--ink-line);
}

.report-title {
  font-size: 20px;
  letter-spacing: 0.03em;
}

.report-sub {
  margin-top: 3px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.report-close {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  border-radius: 3px;
  cursor: pointer;
  padding: 4px 9px;
  font-size: 13px;
}

.report-close:hover {
  color: var(--parchment);
  border-color: var(--parchment-shadow);
}

.report-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-line);
}

.muster-head {
  font-size: 13px;
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.muster-row {
  display: grid;
  grid-template-columns: 20px 1fr 90px 24px;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  padding: 2px 0;
}

.muster-icon {
  display: block;
}

.muster-name {
  color: var(--parchment-dim);
}

.muster-range {
  width: 100%;
  accent-color: var(--gold);
}

.muster-count {
  font-family: var(--numeric);
  font-size: 11px;
  text-align: right;
  color: var(--parchment-shadow);
}

.stance-row {
  display: flex;
  gap: 5px;
  margin-top: 9px;
  flex-wrap: wrap;
}

.stance-chip {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  font-family: var(--display);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
}

.stance-chip:hover {
  color: var(--parchment-dim);
}

.stance-active {
  border-color: var(--gold);
  color: var(--gold-bright);
  background: rgb(201 162 39 / 0.12);
}

.report-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}

.report-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.report-select,
.report-button {
  background: #1d1813;
  border: 1px solid var(--ink-line);
  color: var(--parchment-dim);
  font-family: var(--display);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 3px;
  cursor: pointer;
}

.report-button:hover {
  border-color: var(--gold);
  color: var(--gold-bright);
}

.report-verdict {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 20px 12px;
  padding: 12px 16px;
  border: 1px solid var(--ink-line);
  border-left: 3px solid var(--gold);
  background: rgb(201 162 39 / 0.07);
}

.report-stamp {
  flex: none;
}

.verdict-text {
  font-size: 17px;
  color: var(--gold-bright);
}

.verdict-sub {
  font-size: 11px;
  color: var(--parchment-shadow);
  margin-top: 2px;
  font-family: var(--numeric);
}

.report-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px;
}

.round {
  border-top: 1px solid var(--ink-line);
  padding: 10px 0;
}

.round-number {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.round-sides {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.round-side-head {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--parchment-dim);
}

.round-output {
  font-family: var(--numeric);
  color: var(--gold-bright);
}

.round-math {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 5px 0;
}

.round-base,
.round-mod {
  font-family: var(--numeric);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 2px;
  background: rgb(255 255 255 / 0.04);
  color: var(--parchment-shadow);
}

.mod-up {
  color: #8fbf7f;
}

.mod-down {
  color: #c98a7f;
}

.round-losses {
  font-size: 11px;
  color: var(--parchment-shadow);
  font-style: italic;
}

.report-foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--ink-line);
}

.survivors {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.survivors-value {
  font-size: 12px;
  color: var(--parchment-dim);
}

.panel-action {
  width: 100%;
  background: rgb(201 162 39 / 0.1);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  font-family: var(--display);
  font-size: 13px;
  padding: 9px;
  border-radius: 3px;
  cursor: pointer;
}

.panel-action:hover {
  background: rgb(201 162 39 / 0.2);
}

@media (max-width: 700px) {
  .report-controls,
  .round-sides,
  .report-foot {
    grid-template-columns: 1fr;
  }
}

/* ------------------------------------------------------- county screen --- */

.county-screen {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.cs-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--ink-line);
  background: linear-gradient(180deg, #1b1611, #14100c);
}

.cs-back {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  border-radius: 3px;
  padding: 7px 11px;
  font-size: 13px;
  flex: none;
}

.cs-back:active { color: var(--gold-bright); border-color: var(--gold); }

.cs-title { font-size: 19px; letter-spacing: 0.03em; }

.cs-sub {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
  margin-top: 2px;
}

.cs-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.cs-map-wrap {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: radial-gradient(ellipse at 50% 40%, #1a1511 0%, var(--ink) 72%);
  /* The map scrolls; a press that turns into a scroll must cancel, not fire. */
  touch-action: pan-x pan-y;
}

.cs-map { width: 100%; height: auto; max-width: 760px; }

.cs-tile { cursor: pointer; }
.cs-tile polygon { transition: filter .12s ease; }
.cs-tile:active polygon { filter: brightness(1.15); }

/* Press-and-hold affordance — shows the info gesture is registering. */
.cs-holding polygon {
  stroke: var(--gold-bright);
  stroke-width: 2.4;
  filter: brightness(1.2);
}

.cs-site-label {
  font-size: 9px;
  fill: var(--parchment);
  letter-spacing: 0.04em;
  /* The bar itself must not eat taps meant for the map beneath it; its own
     controls opt back in. */
  pointer-events: none;
}

.ov-top > * {
  pointer-events: auto;
}

/* ------------------------------------------------------------- labour --- */

.labour {
  border-top: 1px solid var(--ink-line);
  padding: 12px 14px 16px;
  background: linear-gradient(180deg, #14100c, #100d0a);
  flex: none;
  max-height: 45vh;
  overflow-y: auto;
}

.labour-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
}

.labour-pole {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.labour-slider { accent-color: var(--gold); width: 100%; }

.labour-counts {
  display: flex;
  justify-content: space-between;
  font-family: var(--numeric);
  font-size: 11px;
  color: var(--parchment-shadow);
  margin-top: 5px;
}

.labour-idle {
  margin-top: 6px;
  font-size: 11px;
  color: #c98a7f;
  font-style: italic;
}

.labour-lines {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.labour-line {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.labour-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--parchment-shadow); display: inline-block;
}

.labour-label { color: var(--parchment-dim); }

.labour-net { font-family: var(--numeric); font-size: 14px; }
.labour-net.gain { color: #8fbf7f; }
.labour-net.loss { color: #c98a7f; }

/* -------------------------------------------------------- sheets etc. --- */

.cs-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgb(8 6 5 / 0.7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}

.cs-sheet {
  width: min(520px, 100%);
  background: linear-gradient(180deg, #191410, #120f0c);
  border: 1px solid var(--ink-line);
  border-radius: 6px 6px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
}

.cs-sheet-title { font-size: 16px; margin-bottom: 10px; }

.cs-sheet-close { width: 100%; margin-top: 12px; }

.cs-info-grid { margin: 0 0 8px; display: flex; flex-direction: column; gap: 5px; }

.cs-info-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.cs-info-value { margin: 0; font-family: var(--numeric); font-size: 13px; color: var(--parchment-dim); }

.chip.danger { border-color: #8c2f24; color: #d98a7f; }
.chip.danger:active { background: rgb(140 47 36 / 0.25); }

.cs-confirm-backdrop {
  position: fixed; inset: 0; background: rgb(8 6 5 / 0.78);
  display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;
}

.cs-confirm {
  width: min(420px, 100%);
  background: linear-gradient(180deg, #191410, #120f0c);
  border: 1px solid var(--ink-line);
  border-left: 3px solid #8c2f24;
  border-radius: 4px; padding: 16px;
}

.cs-confirm-title { font-size: 17px; color: #d98a7f; margin-bottom: 6px; }

.cs-error {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
  background: #2a1512; border: 1px solid #8c2f24; color: #d98a7f;
  padding: 9px 14px; border-radius: 3px; font-size: 13px; z-index: 70;
}

@media (min-width: 900px) {
  .cs-body { flex-direction: row; }
  .labour { border-top: none; border-left: 1px solid var(--ink-line); width: 340px; max-height: none; }
}

.end-turn {
  margin-top: 14px;
  width: 100%;
  background: rgb(201 162 39 / 0.12);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  font-family: var(--display);
  font-size: 15px;
  padding: 11px;
  border-radius: 3px;
}
.end-turn:active { background: rgb(201 162 39 / 0.26); }
.cs-sheet .note { white-space: pre-line; }

.levy-row { display:grid; grid-template-columns:18px 62px 1fr 24px; gap:7px; align-items:center; margin:5px 0; font-size:12px; }
.levy-icon { display:block; }
.levy-name { color: var(--parchment-dim); }
.levy-row input[type=range] { width:100%; accent-color: var(--gold); }
.levy-count { font-family: var(--numeric); font-size:11px; text-align:right; color: var(--parchment-shadow); }
.host { border:1px solid var(--ink-line); border-radius:3px; padding:8px; margin-top:6px; }
.host-head { display:flex; justify-content:space-between; font-size:13px; }
.host-comp { font-size:11px; color: var(--parchment-shadow); margin-top:2px; }
.panel-action:disabled, .chip:disabled { opacity:.45; }

.how-to { margin-top: 12px; }
.how-to summary { cursor: pointer; font-size: 12px; color: var(--gold); letter-spacing: .06em; }
.how-to p { font-size: 12px; line-height: 1.55; color: var(--parchment-shadow); margin: 8px 0 0; }
.how-to b { color: var(--parchment-dim); font-weight: 600; }

/* ---------------------------------------------------------------------------
   Overhead county view (v2 camera).

   Chrome is deliberately thin: a season line, four material readouts, a
   minimap and a county strip. The spec's governing principle is images over
   words, so there is no labelled stat card anywhere below — every figure is a
   picture and a number.
   --------------------------------------------------------------------------- */

.ov {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  background: var(--ink, #0d0b09);
  color: #e8dcc0;
  overflow: hidden;
}

.ov-top {
  /* Floats over the land rather than reserving a band of its own. */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px 14px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  /* Fading to transparent keeps the map readable underneath while still
     giving the numbers enough contrast to sit against terrain of any colour. */
  background: linear-gradient(
    to bottom,
    rgba(13, 11, 9, 0.92) 0%,
    rgba(13, 11, 9, 0.78) 55%,
    rgba(13, 11, 9, 0) 100%
  );
  pointer-events: none;
}

.ov-when {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 15px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.ov-res {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.ov-readout {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px 2px 3px;
  border-radius: 6px;
  background: rgba(34, 28, 22, 0.72);
}

.ov-readout img {
  image-rendering: pixelated;
  display: block;
}

/* Placeholder for a resource whose icon has not been generated. Deliberately
   featureless — it must not be mistakable for finished art. */
.ov-chip {
  width: 30px;
  height: 30px;
  border-radius: 3px;
  background: #4a3f33;
}

.ov-num {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  /* The bar sits on open map, so the digits need to hold up over grass. */
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
}

.ov-readout.up .ov-num { color: #8fc06a; }
.ov-readout.down .ov-num { color: #d47a5f; }

/* The land. Panning is local only — cross-county travel goes through the
   minimap, per the spec, so this never becomes the primary way to get around. */
.ov-stage {
  /* NOT position: relative. The minimap is pinned to the screen rather than to
     the land, so its containing block must be .ov — which does not scroll. */
  flex: 1 1 auto;
  overflow: auto;
  background: #0d0b09;
  /* A PLAIN BLOCK scroll container, deliberately not a centring flex one.
     A centred flex item that overflows its scroller is unreachable at the top
     and left: the overflow is split to both sides and scrollLeft cannot go
     below zero, so the first county would be permanently half off-screen. The
     world always overflows, so there is nothing to centre anyway. */
  -webkit-overflow-scrolling: touch;
}

.ov-map {
  display: block;
  /* Width is set inline, from the world's column count, so ONE COUNTY fills
     the screen's width and the rest of the realm is scrolled to. Fitting the
     whole world here instead would shrink every tile below the tap floor —
     the map would fit, and nothing on it would be usable. */
  height: auto;
}

.ov-corner {
  position: absolute;
  top: 58px;
  right: 8px;
  padding: 4px;
  border-radius: 6px;
  background: rgba(13, 11, 9, 0.82);
  border: 1px solid #3a3128;
  line-height: 0;
}

.mm { display: block; }

.ov-strip {
  display: flex;
  align-items: center;
  gap: 8px;
  padding: 8px 12px calc(8px + env(safe-area-inset-bottom, 0px));
  background: #17130f;
  border-top: 1px solid #2a231c;
  flex: 0 0 auto;
}

/* Which county the camera is on. The strip's figures are per-county, and once
   the map covers the whole realm "whose numbers are these?" needs an answer. */
.ov-where {
  font-size: 13px;
  font-weight: 600;
  letter-spacing: 0.02em;
  margin-right: 2px;
  white-space: nowrap;
}

/* Thermometer, kept from v1 — a fill height reads at a glance where a
   percentage would invite optimising the number instead of feeding people. */
.ov-health {
  margin-left: auto;
  width: 16px;
  height: 40px;
  border-radius: 8px;
  background: #221c16;
  border: 1px solid #3a3128;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.ov-health-fill {
  width: 100%;
  background: #8fc06a;
  transition: height 160ms ease;
}

.ov-health-fill[data-health='sick'] { background: #d4a24f; }
.ov-health-fill[data-health='diseased'] { background: #b8443a; }

/* ---------------------------------------------------------------------------
   Castle ladder preview (dev page). Deleted with castles.html when the castle
   build screen replaces it.
   --------------------------------------------------------------------------- */

.tiers {
  padding: 22px 20px 30px;
  background: #0d0b09;
  color: #e8dcc0;
  min-height: 100vh;
}

.tiers-head {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 24px;
  margin: 0 0 4px;
}

.tiers-sub {
  margin: 0 0 22px;
  color: #a4906c;
  font-size: 13px;
  max-width: 60ch;
}

.tiers-row {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}

.tier {
  width: 190px;
  flex: 0 0 auto;
}

/* The plot is the point: real ground, real scale, no frame around it that
   would flatter the sprite. */
.tier-plot {
  display: block;
  border-radius: 4px;
  margin-bottom: 8px;
}

.tier-rank {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a7a5e;
}

.tier-name {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 17px;
  margin-bottom: 4px;
}

.tier-blurb {
  margin: 0 0 8px;
  font-size: 12px;
  line-height: 1.45;
  color: #bfae8a;
  min-height: 52px;
}

.tier-cost {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.tier-free {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 12px;
  color: #8a7a5e;
}

.tier-stats {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 12px;
  color: #bfae8a;
}

.tier-stats b {
  color: #e8dcc0;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
}

/* ---------------------------------------------------------------------------
   Army token preview (dev page).
   --------------------------------------------------------------------------- */

.armies-grid {
  display: flex;
  gap: 26px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.armies-seat-name {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 15px;
  margin-bottom: 6px;
}

.armies-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  border: 1px solid #5c5344;
}

.armies-sizes {
  display: flex;
  gap: 8px;
}

.armies-label {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 10px;
  color: #8a7a5e;
  text-align: center;
  margin-top: 2px;
}

.armies-vision {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 18px;
  margin: 26px 0 2px;
}

/* Applied to a copy of the same markup, so what is being checked is the real
   sprites rather than a mock-up that could disagree with them. */
.vision-grey {
  filter: grayscale(1);
}

.vision-deut {
  filter: url(#deuteranopia);
}

/* ------------------------------------------------- standalone playtest ---- */
/* Only the one-file handoff build uses these — see src/standalone.tsx. They
   are here rather than inline so the build has no second stylesheet to inline
   and the "one file, no external requests" rule stays trivially true. */

.sa {
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  background: var(--ink, #0d0b09);
}

.sa-tabs {
  display: flex;
  flex: 0 0 auto;
  border-bottom: 1px solid #2a231c;
  background: #14100c;
  padding-top: env(safe-area-inset-top, 0px);
}

.sa-tab {
  flex: 1 1 0;
  background: none;
  border: 0;
  border-bottom: 2px solid transparent;
  color: #8a7a5e;
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 13px;
  padding: 10px 8px;
}

.sa-tab.on {
  color: #e3bf4a;
  border-bottom-color: #c9a227;
}

/* The panes are siblings that fill what the tab strip leaves. `hidden` does
   the switching, so neither is unmounted — the living map would otherwise
   re-bake its whole world on every switch, and the app would lose the match. */
.sa-body {
  position: relative;
  flex: 1 1 auto;
  min-height: 0;
}

.sa-pane {
  position: absolute;
  inset: 0;
  overflow: hidden;
}

.sa-pane[hidden] {
  display: none;
}
</style>

			if (field.status === "grain") {
				const before = grainStage(field.seasonsGrown);
				const grown = field.seasonsGrown + 1;
				const after = grainStage(grown);
				if (before === "mature" && after === "spoiled") events.push({
					county: id,
					kind: "spoiled",
					detail: `Field ${field.id} was left standing and rotted`
				});
				else if (after === "mature") events.push({
					county: id,
					kind: "harvest",
					detail: `Field ${field.id} is ready`
				});
				return {
					...field,
					seasonsGrown: grown
				};
			}
			if (field.status === "cattle" && field.herd > 0 && field.herd < 3) return {
				...field,
				herd: cows > 0 ? field.herd + 1 : field.herd
			};
			return field;
		});
		let castleTier = county.castleTier;
		let building = county.building;
		if (building) {
			const seasonsLeft = building.seasonsLeft - 1;
			if (seasonsLeft <= 0) {
				castleTier = building.tier;
				building = null;
				events.push({
					county: id,
					kind: "castleBuilt",
					detail: `${CASTLES[castleTier].name} completed`
				});
			} else building = {
				...building,
				seasonsLeft
			};
		}
		const needed = county.population * .08;
		const rationLevel = needed > 0 ? clamp(wheat / needed, 0, 2) : 1;
		const seasonsAtRation = Math.abs(rationLevel - county.rationLevel) < .15 ? county.seasonsAtRation + 1 : 1;
		const health = healthFromRations(rationLevel, seasonsAtRation);
		let happiness = clamp(county.happiness + SEASON_HAPPINESS_DRIFT[season] + HEALTH_HAPPINESS[health], 0, 100);
		if (starving) happiness = clamp(happiness - 10, 0, 100);
		const unrestTurns = happiness <= 25 ? county.unrestTurns + 1 : 0;
		if (unrestTurns >= 3 && county.unrestTurns < 3) events.push({
			county: id,
			kind: "revolt",
			detail: "The county is in revolt"
		});
		const growth = starving ? -.04 : happiness > 60 ? .02 : 0;
		const population = Math.max(20, Math.round(county.population * (1 + growth)));
		counties[id] = {
			...county,
			castleTier,
			building,
			food: {
				wheat: Math.round(wheat),
				cows: Math.round(cows)
			},
			happiness,
			population,
			rationLevel,
			seasonsAtRation,
			unrestTurns,
			interior: {
				...county.interior,
				fields
			}
		};
	}
	const nextTurn = working.turn.number + 1;
	const timerHours = working.config.turnTimerHours;
	return {
		match: refreshMovement({
			...working,
			counties,
			treasuries,
			turn: {
				...working.turn,
				number: nextTurn,
				phase: "orders",
				startedAt: working.turn.startedAt,
				deadlineAt: timerHours === null ? null : working.turn.startedAt + timerHours * 36e5
			},
			updatedAt: working.updatedAt
		}),
		events
	};
}

/**
* The AI's county management.
*
* It plays to its FACTION, and the faction's behaviour is derived from the same
* bonuses the player sees — so a Warden AI walls up because the Warden's walls
* are cheap, not because a separate table told it to. Changing a faction's
* bonuses changes how its AI plays, automatically.
*
* Personalities are deliberately generic: there are no named rivals with
* hand-written quirks. Four factions, four ways of playing, and an AI seat is
* locked to its faction for the life of the match.
*
* Deterministic — no clock, no Math.random. The AI's turn has to replay
* identically on every device, exactly like combat.
*/
/** Seasons of food in store an AI wants before it stops worrying about food. */
var FOOD_BUFFER_SEASONS = 3;
/**
* Play one AI player's county-management turn.
*
* Order matters and is not arbitrary: feed the county, then work it, then build.
* An AI that starts a castle while its people starve loses the county before
* the castle is finished.
*/
function takeAiTurn(match, playerId) {
	const player = match.players.find((p) => p.id === playerId);
	if (!player || !isAi(player) || player.status !== "active") return {
		match,
		decisions: []
	};
	const weighting = aiWeightingOf(getFaction(player.factionId));
	const season = seasonOfTurn(match.turn.number);
	const decisions = [];
	let current = match;
	for (const countyId of countiesOwnedBy(current, playerId)) {
		const county = current.counties[countyId];
		if (!county?.interior) continue;
		const buffer = county.population * GRAIN_PER_HEAD * FOOD_BUFFER_SEASONS;
		const hungry = county.food.wheat < buffer;
		const fallow = county.interior.fields.filter((f) => f.status === "fallow");
		let sown = 0;
		let grazed = 0;
		for (const [index, field] of fallow.entries()) {
			const wantCattle = !hungry && index % 4 === 3;
			const result = setFieldUse(current, countyId, field.id, wantCattle ? "cattle" : "grain");
			if (result.ok) {
				current = result.match;
				if (wantCattle) grazed++;
				else sown++;
			}
		}
		if (sown > 0 || grazed > 0) decisions.push({
			county: countyId,
			what: `sowed ${sown} field${sown === 1 ? "" : "s"}${grazed ? `, grazed ${grazed}` : ""}`
		});
		const runIndustry = weighting.economy >= .45;
		for (const site of current.counties[countyId]?.interior?.industry ?? []) {
			if (site.active === runIndustry) continue;
			const result = toggleIndustry(current, countyId, site.kind);
			if (result.ok) {
				current = result.match;
				decisions.push({
					county: countyId,
					what: `${runIndustry ? "opened" : "closed"} the ${site.kind}`
				});
			}
		}
		const share = chooseLabourSplit({
			weighting,
			hungry,
			winter: season === "winter",
			buildingCastle: county.building !== null
		});
		const setShare = setLabourSplit(current, countyId, share);
		if (setShare.ok) current = setShare.match;
		const after = current.counties[countyId];
		if (after && !after.building && !hungry) {
			const next = nextCastleTier(after.castleTier);
			if (next && wantsCastle(weighting, after.castleTier)) {
				const treasury = current.treasuries[playerId];
				const cost = scaledCost(after.castleTier, next, getFaction(player.factionId).bonuses.castleCost);
				if (treasury && canAfford(treasury, cost)) {
					current = {
						...current,
						treasuries: {
							...current.treasuries,
							[playerId]: spend(treasury, cost)
						},
						counties: {
							...current.counties,
							[countyId]: {
								...after,
								building: {
									tier: next,
									seasonsLeft: CASTLES[next].seasons
								}
							}
						}
					};
					decisions.push({
						county: countyId,
						what: `began a ${CASTLES[next].name}`
					});
				}
			}
		}
	}
	return {
		match: current,
		decisions
	};
}
/**
* Where to point the workforce.
*
* Food comes first regardless of faction — a starving county revolts and is
* lost, and no bonus is worth that. Only once fed does the faction's own
* leaning decide anything.
*/
function chooseLabourSplit(opts) {
	const { weighting, hungry, winter, buildingCastle } = opts;
	if (hungry && !winter) return .9;
	if (winter) return .15;
	let share = .65 - weighting.economy * .3;
	if (buildingCastle) share -= .2 * weighting.turtling;
	return Math.min(.95, Math.max(.1, share));
}
/** The next rung up the ladder, or null at the top. */
function nextCastleTier(current) {
	const index = CASTLE_TIERS.indexOf(current);
	if (index < 0 || index >= CASTLE_TIERS.length - 1) return null;
	return CASTLE_TIERS[index + 1] ?? null;
}
/**
* Whether this faction wants to keep building.
*
* A turtling faction climbs the whole ladder; an aggressive one stops once it
* has walls worth the name and spends the rest on troops.
*/
function wantsCastle(weighting, current) {
	const ceiling = Math.round(1 + weighting.turtling * (CASTLE_TIERS.length - 2));
	return castleRank(current) < ceiling;
}
var scaledCost = (from, to, costMultiplier) => {
	const base = upgradeCost(from, to);
	const out = {};
	for (const [key, value] of Object.entries(base)) out[key] = Math.round((value ?? 0) * costMultiplier);
	return out;
};
var canAfford = (treasury, cost) => Object.entries(cost).every(([k, v]) => treasury[k] >= (v ?? 0));
var spend = (treasury, cost) => {
	const out = { ...treasury };
	for (const [k, v] of Object.entries(cost)) out[k] -= v ?? 0;
	return out;
};
/** Play every AI seat's turn, in seat order so the result is reproducible. */
function takeAllAiTurns(match) {
	let current = match;
	const decisions = [];
	for (const player of [...match.players].sort((a, b) => a.seat - b.seat)) {
		if (!isAi(player)) continue;
		const result = takeAiTurn(current, player.id);
		current = result.match;
		decisions.push(...result.decisions);
	}
	return {
		match: current,
		decisions
	};
}

/** Gold kept back so an army is not raised into instant desertion. */
var WAGE_RESERVE_SEASONS = 4;
/**
* How much force this faction wants standing before it considers attacking.
* A cautious faction wants a large margin; an aggressive one will take a fight
* closer to even.
*/
var requiredAdvantage = (weighting) => 2.4 - weighting.aggression * 1.2;
/** Score a county as a target: weak, valuable and adjacent beats strong. */
function scoreTarget(match, ix, countyId) {
	const def = ix.countyById.get(countyId);
	const state = match.counties[countyId];
	if (!def || !state) return -Infinity;
	const defenders = garrisonOf(match, countyId).reduce((sum, a) => sum + troopCount(a.troops), 0);
	const castle = CASTLES[state.castleTier].defence;
	const terrain = TERRAIN_DEFENCE_MODIFIER[def.terrain];
	const worth = def.size * 2 + def.yield / 4;
	const cost = defenders * .5 * castle * terrain;
	return worth + (state.owner === null ? 6 : 0) - cost;
}
/**
* Play one AI player's military turn.
*
* Order: garrison what is held, raise what can be afforded, then march. An AI
* that marches before it garrisons loses the county it just left.
*/
function takeMilitaryTurn(match, ix, playerId) {
	const player = match.players.find((p) => p.id === playerId);
	if (!player || !isAi(player) || player.status !== "active") return {
		match,
		decisions: []
	};
	const weighting = aiWeightingOf(getFaction(player.factionId));
	const decisions = [];
	let current = match;
	for (const countyId of countiesOwnedBy(current, playerId)) {
		if (!current.counties[countyId]) continue;
		const here = garrisonOf(current, countyId).reduce((sum, a) => sum + troopCount(a.troops), 0);
		const want = Math.round(10 + weighting.aggression * 30);
		if (here >= want) continue;
		const treasury = current.treasuries[playerId];
		if (!treasury) continue;
		const batch = composeLevy(want - here, weighting);
		const projectedWages = (Object.values(current.armies).filter((a) => a.owner === playerId).reduce((s, a) => s + upkeepOf(a.troops), 0) + upkeepOf(batch)) * WAGE_RESERVE_SEASONS;
		if (treasury.gold < projectedWages) continue;
		const result = recruitArmy(current, countyId, batch);
		if (result.ok) {
			current = result.match;
			decisions.push({
				county: countyId,
				what: `raised ${troopCount(batch)} troops`
			});
		}
	}
	if (weighting.aggression >= .4) for (const army of Object.values(current.armies)) {
		if (army.owner !== playerId) continue;
		if (army.location.kind !== "garrison") continue;
		if (army.movementRemaining <= 0) continue;
		const from = army.location.county;
		const strength = troopCount(army.troops);
		if (strength <= 10) continue;
		const held = new Set(countiesOwnedBy(current, playerId));
		const connects = (target) => held.size === 0 || neighboursOf(ix, target).some((n) => held.has(n));
		const best = neighboursOf(ix, from).filter((n) => current.counties[n]?.owner !== playerId).filter(connects).map((n) => ({
			id: n,
			score: scoreTarget(current, ix, n)
		})).filter((t) => t.score > 0).sort((a, b) => b.score - a.score || a.id.localeCompare(b.id))[0];
		if (!best) continue;
		const defenders = garrisonOf(current, best.id).reduce((sum, a) => sum + troopCount(a.troops), 0);
		const needed = defenders * requiredAdvantage(weighting);
		if (defenders > 0 && strength < needed) continue;
		const result = moveArmy(current, ix, army.id, best.id);
		if (result.ok) {
			current = result.match;
			decisions.push({
				county: best.id,
				what: defenders === 0 ? `marched on undefended ${best.id}` : `attacked ${best.id}`
			});
		}
	}
	return {
		match: current,
		decisions
	};
}
/**
* What to raise.
*
* Aggressive factions want knights to break a line; cautious ones want cheap
* bodies and archers to bleed an attacker from behind a wall.
*/
function composeLevy(size, weighting) {
	const total = Math.max(1, size);
	const knights = Math.round(total * weighting.aggression * .25);
	const archers = Math.round(total * (.2 + weighting.turtling * .25));
	const militia = Math.max(0, total - knights - archers);
	const levy = {};
	if (militia > 0) levy.militia = militia;
	if (archers > 0) levy.archers = archers;
	if (knights > 0) levy.knights = knights;
	return levy;
}
/** Play every AI seat's military turn, in seat order. */
function takeAllMilitaryTurns(match, ix) {
	let current = match;
	const decisions = [];
	for (const player of [...match.players].sort((a, b) => a.seat - b.seat)) {
		if (!isAi(player)) continue;
		const result = takeMilitaryTurn(current, ix, player.id);
		current = result.match;
		decisions.push(...result.decisions);
	}
	return {
		match: current,
		decisions
	};
}

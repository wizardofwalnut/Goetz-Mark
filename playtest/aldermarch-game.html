<style>/*
 * Ink-and-parchment. Ink field, parchment surfaces, seat colours for sides,
 * aged gold reserved for the things the player is meant to act on — it is the
 * only colour that means "do this", so it never appears as decoration.
 */

:root {
  --ink: #0d0b09;
  --ink-soft: #17130f;
  --ink-line: #2a231c;
  --parchment: #e8dcc0;
  --parchment-dim: #d3c4a2;
  --parchment-deep: #bfae8a;
  --parchment-shadow: #a4906c;
  --gold: #c9a227;
  --gold-bright: #e3bf4a;
  --wax: #8c2f24;

  --display: 'Iowan Old Style', 'Palatino Linotype', Palatino, Georgia, serif;
  --numeric: 'SF Mono', 'Cascadia Mono', Menlo, Consolas, monospace;

  --panel-w: 340px;
  color-scheme: dark;
}

* {
  box-sizing: border-box;
}

html,
body,
#root {
  height: 100%;
  margin: 0;
}

body {
  background: var(--ink);
  color: var(--parchment);
  font-family: var(--display);
  -webkit-font-smoothing: antialiased;
  overscroll-behavior: none;
}

.app {
  display: grid;
  grid-template-columns: 1fr var(--panel-w);
  height: 100%;
  gap: 0;
}

/* ---------------------------------------------------------------- map ---- */

.map-stage {
  position: relative;
  overflow: hidden;
  background:
    radial-gradient(ellipse at 50% 40%, #191410 0%, var(--ink) 70%);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 16px;
}

.map-svg {
  height: 100%;
  width: auto;
  max-width: 100%;
  filter: drop-shadow(0 18px 40px rgb(0 0 0 / 0.55));
}

.county {
  cursor: pointer;
  outline: none;
}

.county:hover path:first-of-type {
  filter: brightness(1.08);
}

.county:focus-visible path:nth-of-type(3) {
  stroke: var(--gold-bright);
  stroke-width: 4;
}

.county-selected {
  animation: march 1.4s linear infinite;
}

@keyframes march {
  to {
    stroke-dashoffset: -16;
  }
}

.county-label {
  font-size: 17px;
  font-weight: 600;
  fill: var(--ink);
  letter-spacing: 0.02em;
  paint-order: stroke;
  stroke: rgb(232 220 192 / 0.75);
  stroke-width: 3.5px;
  stroke-linejoin: round;
}

.county-sub {
  font-size: 11px;
  fill: #4a3f31;
  letter-spacing: 0.04em;
  paint-order: stroke;
  stroke: rgb(232 220 192 / 0.6);
  stroke-width: 2.5px;
}

.garrison-count {
  font-size: 11px;
  font-weight: 600;
}

/* -------------------------------------------------------------- panel ---- */

.panel {
  background: linear-gradient(180deg, #14100c 0%, #100d0a 100%);
  border-left: 1px solid var(--ink-line);
  display: flex;
  flex-direction: column;
  overflow-y: auto;
  padding: 0 0 20px;
}

.panel-header {
  padding: 20px 20px 16px;
  border-bottom: 1px solid var(--ink-line);
  background: linear-gradient(180deg, #1b1611 0%, #14100c 100%);
}

.panel-title {
  font-size: 21px;
  letter-spacing: 0.04em;
  color: var(--parchment);
}

.panel-turn {
  margin-top: 4px;
  font-size: 12px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.panel-section {
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-line);
}

.panel-grow {
  flex: 1 0 auto;
}

.section-heading {
  margin: 0 0 10px;
  font-size: 10px;
  font-weight: 700;
  letter-spacing: 0.18em;
  text-transform: uppercase;
  color: var(--gold);
}

/* --------------------------------------------------------------- lords --- */

.lord-list {
  list-style: none;
  margin: 0;
  padding: 0;
  display: flex;
  flex-direction: column;
  gap: 2px;
}

.lord {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 7px 8px;
  border-radius: 3px;
  font-size: 14px;
}

.lord-active {
  background: rgb(201 162 39 / 0.1);
  box-shadow: inset 2px 0 0 var(--gold);
}

.lord-swatch {
  width: 11px;
  height: 11px;
  border-radius: 2px;
  flex: none;
  box-shadow: 0 0 0 1px rgb(0 0 0 / 0.5);
}

.lord-crest {
  flex: none;
  display: block;
}

.resource-icon {
  vertical-align: -3px;
  margin-right: 5px;
}

.stat-with-icon {
  display: flex;
  align-items: center;
  justify-content: flex-end;
  gap: 2px;
}

.lord-name {
  display: flex;
  flex-direction: column;
  line-height: 1.25;
  flex: 1;
}

.lord-faction {
  font-size: 11px;
  color: var(--parchment-shadow);
}

.lord-meta {
  font-family: var(--numeric);
  font-size: 11px;
  color: var(--parchment-shadow);
}

/* -------------------------------------------------------------- county --- */

.empty-hint {
  margin: 0;
  font-size: 13px;
  color: var(--parchment-shadow);
  font-style: italic;
}

.county-detail-head {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 8px;
  margin-bottom: 12px;
}

.county-detail-name {
  font-size: 19px;
  color: var(--parchment);
}

.county-detail-owner {
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.stat-grid {
  display: grid;
  grid-template-columns: auto 1fr;
  gap: 5px 14px;
  margin: 0 0 12px;
  align-items: baseline;
}

.stat-label {
  font-size: 10px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.stat-value {
  margin: 0;
  font-size: 13px;
  color: var(--parchment-dim);
  text-align: right;
  font-family: var(--numeric);
}

.garrison-row,
.neighbour-row {
  padding-top: 10px;
  border-top: 1px solid var(--ink-line);
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.garrison-value {
  font-size: 13px;
  color: var(--parchment-dim);
}

.neighbour-list {
  font-size: 12px;
  color: var(--parchment-shadow);
  line-height: 1.45;
}

/* ------------------------------------------------------------ treasury --- */

.treasury {
  display: grid;
  grid-template-columns: repeat(2, 1fr);
  gap: 4px 12px;
}

.treasury-item {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  font-size: 12px;
  padding: 2px 0;
}

.treasury-label {
  color: var(--parchment-shadow);
}

.treasury-amount {
  color: var(--gold-bright);
}

.treasury-note {
  margin: 10px 0 0;
  font-size: 11px;
  line-height: 1.5;
  color: var(--parchment-shadow);
  font-style: italic;
}

/* ------------------------------------------------------------- mobile ---- */

@media (max-width: 860px) {
  .app {
    grid-template-columns: 1fr;
    grid-template-rows: 1fr auto;
  }

  .panel {
    border-left: none;
    border-top: 1px solid var(--ink-line);
    max-height: 46vh;
  }

  .map-svg {
    height: auto;
    width: 100%;
    max-height: 100%;
  }
}

/* ------------------------------------------------------- battle report --- */

.report-backdrop {
  position: fixed;
  inset: 0;
  background: rgb(8 6 5 / 0.82);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 20px;
  z-index: 40;
}

.report {
  width: min(860px, 100%);
  max-height: 92vh;
  display: flex;
  flex-direction: column;
  background: linear-gradient(180deg, #191410 0%, #120f0c 100%);
  border: 1px solid var(--ink-line);
  border-radius: 4px;
  box-shadow: 0 30px 80px rgb(0 0 0 / 0.7);
}

.report-head {
  display: flex;
  justify-content: space-between;
  align-items: flex-start;
  padding: 18px 20px 14px;
  border-bottom: 1px solid var(--ink-line);
}

.report-title {
  font-size: 20px;
  letter-spacing: 0.03em;
}

.report-sub {
  margin-top: 3px;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.report-close {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  border-radius: 3px;
  cursor: pointer;
  padding: 4px 9px;
  font-size: 13px;
}

.report-close:hover {
  color: var(--parchment);
  border-color: var(--parchment-shadow);
}

.report-controls {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 18px;
  padding: 16px 20px;
  border-bottom: 1px solid var(--ink-line);
}

.muster-head {
  font-size: 13px;
  margin-bottom: 8px;
  letter-spacing: 0.02em;
}

.muster-row {
  display: grid;
  grid-template-columns: 20px 1fr 90px 24px;
  align-items: center;
  gap: 7px;
  font-size: 12px;
  padding: 2px 0;
}

.muster-icon {
  display: block;
}

.muster-name {
  color: var(--parchment-dim);
}

.muster-range {
  width: 100%;
  accent-color: var(--gold);
}

.muster-count {
  font-family: var(--numeric);
  font-size: 11px;
  text-align: right;
  color: var(--parchment-shadow);
}

.stance-row {
  display: flex;
  gap: 5px;
  margin-top: 9px;
  flex-wrap: wrap;
}

.stance-chip {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  font-family: var(--display);
  font-size: 11px;
  padding: 4px 8px;
  border-radius: 3px;
  cursor: pointer;
}

.stance-chip:hover {
  color: var(--parchment-dim);
}

.stance-active {
  border-color: var(--gold);
  color: var(--gold-bright);
  background: rgb(201 162 39 / 0.12);
}

.report-row {
  display: flex;
  align-items: flex-end;
  justify-content: space-between;
  gap: 12px;
  padding: 12px 20px;
}

.report-field {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.report-select,
.report-button {
  background: #1d1813;
  border: 1px solid var(--ink-line);
  color: var(--parchment-dim);
  font-family: var(--display);
  font-size: 12px;
  padding: 6px 10px;
  border-radius: 3px;
  cursor: pointer;
}

.report-button:hover {
  border-color: var(--gold);
  color: var(--gold-bright);
}

.report-verdict {
  display: flex;
  align-items: center;
  gap: 14px;
  margin: 0 20px 12px;
  padding: 12px 16px;
  border: 1px solid var(--ink-line);
  border-left: 3px solid var(--gold);
  background: rgb(201 162 39 / 0.07);
}

.report-stamp {
  flex: none;
}

.verdict-text {
  font-size: 17px;
  color: var(--gold-bright);
}

.verdict-sub {
  font-size: 11px;
  color: var(--parchment-shadow);
  margin-top: 2px;
  font-family: var(--numeric);
}

.report-scroll {
  flex: 1;
  overflow-y: auto;
  padding: 0 20px;
}

.round {
  border-top: 1px solid var(--ink-line);
  padding: 10px 0;
}

.round-number {
  font-size: 10px;
  letter-spacing: 0.16em;
  text-transform: uppercase;
  color: var(--gold);
  margin-bottom: 6px;
}

.round-sides {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
}

.round-side-head {
  display: flex;
  justify-content: space-between;
  font-size: 12px;
  color: var(--parchment-dim);
}

.round-output {
  font-family: var(--numeric);
  color: var(--gold-bright);
}

.round-math {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin: 5px 0;
}

.round-base,
.round-mod {
  font-family: var(--numeric);
  font-size: 10px;
  padding: 2px 5px;
  border-radius: 2px;
  background: rgb(255 255 255 / 0.04);
  color: var(--parchment-shadow);
}

.mod-up {
  color: #8fbf7f;
}

.mod-down {
  color: #c98a7f;
}

.round-losses {
  font-size: 11px;
  color: var(--parchment-shadow);
  font-style: italic;
}

.report-foot {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 16px;
  padding: 12px 20px 16px;
  border-top: 1px solid var(--ink-line);
}

.survivors {
  display: flex;
  flex-direction: column;
  gap: 3px;
}

.survivors-value {
  font-size: 12px;
  color: var(--parchment-dim);
}

.panel-action {
  width: 100%;
  background: rgb(201 162 39 / 0.1);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  font-family: var(--display);
  font-size: 13px;
  padding: 9px;
  border-radius: 3px;
  cursor: pointer;
}

.panel-action:hover {
  background: rgb(201 162 39 / 0.2);
}

@media (max-width: 700px) {
  .report-controls,
  .round-sides,
  .report-foot {
    grid-template-columns: 1fr;
  }
}

/* ------------------------------------------------------- county screen --- */

.county-screen {
  position: fixed;
  inset: 0;
  z-index: 30;
  background: var(--ink);
  display: flex;
  flex-direction: column;
  overflow: hidden;
}

.cs-head {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px 14px;
  border-bottom: 1px solid var(--ink-line);
  background: linear-gradient(180deg, #1b1611, #14100c);
}

.cs-back {
  background: none;
  border: 1px solid var(--ink-line);
  color: var(--parchment-shadow);
  border-radius: 3px;
  padding: 7px 11px;
  font-size: 13px;
  flex: none;
}

.cs-back:active { color: var(--gold-bright); border-color: var(--gold); }

.cs-title { font-size: 19px; letter-spacing: 0.03em; }

.cs-sub {
  font-size: 11px;
  letter-spacing: 0.06em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
  margin-top: 2px;
}

.cs-body {
  flex: 1;
  display: flex;
  flex-direction: column;
  min-height: 0;
}

.cs-map-wrap {
  flex: 1;
  overflow: auto;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 10px;
  background: radial-gradient(ellipse at 50% 40%, #1a1511 0%, var(--ink) 72%);
  /* The map scrolls; a press that turns into a scroll must cancel, not fire. */
  touch-action: pan-x pan-y;
}

.cs-map { width: 100%; height: auto; max-width: 760px; }

.cs-tile { cursor: pointer; }
.cs-tile polygon { transition: filter .12s ease; }
.cs-tile:active polygon { filter: brightness(1.15); }

/* Press-and-hold affordance — shows the info gesture is registering. */
.cs-holding polygon {
  stroke: var(--gold-bright);
  stroke-width: 2.4;
  filter: brightness(1.2);
}

.cs-site-label {
  font-size: 9px;
  fill: var(--parchment);
  letter-spacing: 0.04em;
  /* The bar itself must not eat taps meant for the map beneath it; its own
     controls opt back in. */
  pointer-events: none;
}

.ov-top > * {
  pointer-events: auto;
}

/* ------------------------------------------------------------- labour --- */

.labour {
  border-top: 1px solid var(--ink-line);
  padding: 12px 14px 16px;
  background: linear-gradient(180deg, #14100c, #100d0a);
  flex: none;
  max-height: 45vh;
  overflow-y: auto;
}

.labour-head {
  display: grid;
  grid-template-columns: auto 1fr auto;
  gap: 10px;
  align-items: center;
}

.labour-pole {
  font-size: 10px;
  letter-spacing: 0.14em;
  text-transform: uppercase;
  color: var(--parchment-shadow);
}

.labour-slider { accent-color: var(--gold); width: 100%; }

.labour-counts {
  display: flex;
  justify-content: space-between;
  font-family: var(--numeric);
  font-size: 11px;
  color: var(--parchment-shadow);
  margin-top: 5px;
}

.labour-idle {
  margin-top: 6px;
  font-size: 11px;
  color: #c98a7f;
  font-style: italic;
}

.labour-lines {
  margin-top: 10px;
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.labour-line {
  display: grid;
  grid-template-columns: 18px 1fr auto;
  gap: 8px;
  align-items: center;
  font-size: 13px;
}

.labour-dot {
  width: 8px; height: 8px; border-radius: 50%;
  background: var(--parchment-shadow); display: inline-block;
}

.labour-label { color: var(--parchment-dim); }

.labour-net { font-family: var(--numeric); font-size: 14px; }
.labour-net.gain { color: #8fbf7f; }
.labour-net.loss { color: #c98a7f; }

/* -------------------------------------------------------- sheets etc. --- */

.cs-sheet-backdrop {
  position: fixed;
  inset: 0;
  background: rgb(8 6 5 / 0.7);
  display: flex;
  align-items: flex-end;
  justify-content: center;
  z-index: 50;
}

.cs-sheet {
  width: min(520px, 100%);
  background: linear-gradient(180deg, #191410, #120f0c);
  border: 1px solid var(--ink-line);
  border-radius: 6px 6px 0 0;
  padding: 16px 16px calc(16px + env(safe-area-inset-bottom));
}

.cs-sheet-title { font-size: 16px; margin-bottom: 10px; }

.cs-sheet-close { width: 100%; margin-top: 12px; }

.cs-info-grid { margin: 0 0 8px; display: flex; flex-direction: column; gap: 5px; }

.cs-info-row { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; }

.cs-info-value { margin: 0; font-family: var(--numeric); font-size: 13px; color: var(--parchment-dim); }

.chip.danger { border-color: #8c2f24; color: #d98a7f; }
.chip.danger:active { background: rgb(140 47 36 / 0.25); }

.cs-confirm-backdrop {
  position: fixed; inset: 0; background: rgb(8 6 5 / 0.78);
  display: flex; align-items: center; justify-content: center; z-index: 60; padding: 20px;
}

.cs-confirm {
  width: min(420px, 100%);
  background: linear-gradient(180deg, #191410, #120f0c);
  border: 1px solid var(--ink-line);
  border-left: 3px solid #8c2f24;
  border-radius: 4px; padding: 16px;
}

.cs-confirm-title { font-size: 17px; color: #d98a7f; margin-bottom: 6px; }

.cs-error {
  position: fixed; left: 50%; transform: translateX(-50%); bottom: 18px;
  background: #2a1512; border: 1px solid #8c2f24; color: #d98a7f;
  padding: 9px 14px; border-radius: 3px; font-size: 13px; z-index: 70;
}

@media (min-width: 900px) {
  .cs-body { flex-direction: row; }
  .labour { border-top: none; border-left: 1px solid var(--ink-line); width: 340px; max-height: none; }
}

.end-turn {
  margin-top: 14px;
  width: 100%;
  background: rgb(201 162 39 / 0.12);
  border: 1px solid var(--gold);
  color: var(--gold-bright);
  font-family: var(--display);
  font-size: 15px;
  padding: 11px;
  border-radius: 3px;
}
.end-turn:active { background: rgb(201 162 39 / 0.26); }
.cs-sheet .note { white-space: pre-line; }

.levy-row { display:grid; grid-template-columns:18px 62px 1fr 24px; gap:7px; align-items:center; margin:5px 0; font-size:12px; }
.levy-icon { display:block; }
.levy-name { color: var(--parchment-dim); }
.levy-row input[type=range] { width:100%; accent-color: var(--gold); }
.levy-count { font-family: var(--numeric); font-size:11px; text-align:right; color: var(--parchment-shadow); }
.host { border:1px solid var(--ink-line); border-radius:3px; padding:8px; margin-top:6px; }
.host-head { display:flex; justify-content:space-between; font-size:13px; }
.host-comp { font-size:11px; color: var(--parchment-shadow); margin-top:2px; }
.panel-action:disabled, .chip:disabled { opacity:.45; }

.how-to { margin-top: 12px; }
.how-to summary { cursor: pointer; font-size: 12px; color: var(--gold); letter-spacing: .06em; }
.how-to p { font-size: 12px; line-height: 1.55; color: var(--parchment-shadow); margin: 8px 0 0; }
.how-to b { color: var(--parchment-dim); font-weight: 600; }

/* ---------------------------------------------------------------------------
   Overhead county view (v2 camera).

   Chrome is deliberately thin: a season line, four material readouts, a
   minimap and a county strip. The spec's governing principle is images over
   words, so there is no labelled stat card anywhere below — every figure is a
   picture and a number.
   --------------------------------------------------------------------------- */

.ov {
  position: relative;
  display: flex;
  flex-direction: column;
  height: 100vh;
  height: 100dvh;
  background: var(--ink, #0d0b09);
  color: #e8dcc0;
  overflow: hidden;
}

.ov-top {
  /* Floats over the land rather than reserving a band of its own. */
  position: absolute;
  top: 0;
  left: 0;
  right: 0;
  z-index: 2;
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 8px 12px 14px;
  padding-top: calc(8px + env(safe-area-inset-top, 0px));
  /* Fading to transparent keeps the map readable underneath while still
     giving the numbers enough contrast to sit against terrain of any colour. */
  background: linear-gradient(
    to bottom,
    rgba(13, 11, 9, 0.92) 0%,
    rgba(13, 11, 9, 0.78) 55%,
    rgba(13, 11, 9, 0) 100%
  );
  pointer-events: none;
}

.ov-when {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 15px;
  letter-spacing: 0.01em;
  white-space: nowrap;
  text-shadow: 0 1px 3px rgba(0, 0, 0, 0.9);
}

.ov-res {
  display: flex;
  gap: 4px;
  margin-left: auto;
}

.ov-readout {
  display: flex;
  align-items: center;
  gap: 3px;
  padding: 2px 6px 2px 3px;
  border-radius: 6px;
  background: rgba(34, 28, 22, 0.72);
}

.ov-readout img {
  image-rendering: pixelated;
  display: block;
}

/* Placeholder for a resource whose icon has not been generated. Deliberately
   featureless — it must not be mistakable for finished art. */
.ov-chip {
  width: 30px;
  height: 30px;
  border-radius: 3px;
  background: #4a3f33;
}

.ov-num {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 15px;
  font-variant-numeric: tabular-nums;
  /* The bar sits on open map, so the digits need to hold up over grass. */
  text-shadow: 0 1px 2px rgba(0, 0, 0, 0.85);
}

.ov-readout.up .ov-num { color: #8fc06a; }
.ov-readout.down .ov-num { color: #d47a5f; }

/* Labor allocation screen — the fine-grained 8-slot grid. Full-screen
   overlay rather than a floating panel, since this is meant for deliberate
   micromanagement, not a glance-and-dismiss interaction like the caravan
   panel. Shortage numbers (grain/cattle only, per spec) render in red via
   `.ov-labor-shortage`; every other slot's count is always the default
   parchment color, matching "100 laborers working as wood cutters" reading
   as plain, unremarkable text. */
.ov-labor-overlay {
  position: fixed;
  inset: 0;
  background: rgba(10, 8, 6, 0.94);
  z-index: 20;
  display: flex;
  flex-direction: column;
  color: #e8dcc0;
}

.ov-labor-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px calc(10px + env(safe-area-inset-top, 0px));
  border-bottom: 1px solid #2a231c;
  flex: 0 0 auto;
}

.ov-labor-header h2 {
  margin: 0;
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 16px;
  color: #e3bf4a;
}

.ov-labor-close {
  background: none;
  border: none;
  color: #a89372;
  font-size: 20px;
  line-height: 1;
  padding: 4px 8px;
}

.ov-labor-grid {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 8px;
  padding: 10px;
  flex: 1 1 auto;
  overflow-y: auto;
}

.ov-labor-cell {
  background: #17130f;
  border: 1px solid #2a231c;
  border-radius: 8px;
  padding: 8px;
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 4px;
  min-height: 108px;
  justify-content: center;
}

.ov-labor-cell.decorative { opacity: .5; }

.ov-labor-cell img, .ov-labor-cell .ov-chip {
  width: 40px;
  height: 40px;
}

/* Merchant panel — its own parchment skin, scoped so it can't affect the
   still-dark Labor/Levy screens. Reuses `.ov-labor-overlay`'s fixed/inset
   positioning mechanics conceptually but needs its own background, so it's
   a full separate rule rather than an override on a shared class. */
.ov-merchant-overlay {
  position: fixed;
  inset: 0;
  z-index: 20;
  display: flex;
  flex-direction: column;
  background: var(--parchment-dim);
  background-image: radial-gradient(circle at 20% 0%, rgba(255, 255, 255, 0.14), transparent 60%);
  color: var(--ink);
}

.ov-merchant-header {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 12px 14px calc(10px + env(safe-area-inset-top, 0px));
  border-bottom: 2px solid #8a6a1c;
  flex: 0 0 auto;
}

.ov-merchant-header h2 {
  margin: 0;
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 18px;
  font-weight: 800;
  color: var(--ink);
}

.ov-merchant-close {
  width: 30px;
  height: 30px;
  border-radius: 50%;
  background: var(--parchment);
  border: 2px solid var(--parchment-shadow);
  color: var(--ink);
  font-size: 15px;
  font-weight: 800;
}

.ov-merchant-body {
  flex: 1 1 auto;
  overflow-y: auto;
  padding: 10px 12px 4px;
}

.ov-merchant-section-label {
  color: #5a4525;
  font-size: 11px;
  font-weight: 800;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  margin: 12px 2px 6px;
}

.ov-merchant-row {
  display: flex;
  align-items: center;
  gap: 10px;
  background: var(--parchment);
  border: 2px solid var(--parchment-shadow);
  border-radius: 10px;
  padding: 8px 10px;
  margin-bottom: 7px;
}

.ov-merchant-row.short { border-color: #8c2f24; }

.ov-merchant-icon {
  width: 38px;
  height: 38px;
  border-radius: 8px;
  background: var(--parchment-dim);
  border: 1px solid var(--parchment-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  flex: none;
}

.ov-merchant-icon img { width: 30px; height: 30px; }

.ov-merchant-body-text { flex: 1; min-width: 0; }

.ov-merchant-top {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
}

.ov-merchant-label { font-weight: 800; font-size: 14px; color: var(--ink); }
.ov-merchant-held { color: #5a4525; font-size: 12px; }
.ov-merchant-price { color: #7a5c1c; font-size: 11px; font-weight: 700; }
.ov-merchant-price .sell { margin-left: 8px; }

.ov-merchant-stepper {
  display: flex;
  align-items: center;
  background: var(--parchment-deep);
  border: 1px solid var(--parchment-shadow);
  border-radius: 8px;
  overflow: hidden;
  flex: none;
}

.ov-merchant-stepper button {
  width: 26px;
  height: 28px;
  background: var(--parchment);
  border: none;
  color: var(--ink);
  font-size: 15px;
  font-weight: 800;
  padding: 0;
}

.ov-merchant-stepper button:disabled { opacity: .35; }

.ov-merchant-stepper .qty {
  width: 32px;
  text-align: center;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}

.ov-merchant-stepper .qty.pending { color: #1f5a8c; }
.ov-merchant-stepper .qty.pending.sell { color: #8c2f24; }

.ov-merchant-gold {
  display: flex;
  align-items: center;
  gap: 6px;
  background: var(--parchment);
  border: 2px solid var(--parchment-shadow);
  border-radius: 8px;
  padding: 4px 10px;
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
}

.ov-merchant-gold .arrow { color: #5a4525; font-weight: 700; }
.ov-merchant-gold .projected.up { color: #3a6b2e; }
.ov-merchant-gold .projected.down { color: #8c2f24; }

.ov-merchant-summary {
  margin: 10px 0;
  background: var(--parchment);
  border: 2px solid var(--parchment-shadow);
  border-radius: 10px;
  padding: 10px 12px;
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.ov-merchant-summary .label { color: #5a4525; font-size: 12px; font-weight: 700; }
.ov-merchant-summary .amount { font-weight: 800; font-size: 15px; color: #7a5c1c; }

.ov-merchant-footer {
  flex: 0 0 auto;
  padding: 4px 12px calc(10px + env(safe-area-inset-bottom, 0px));
  display: flex;
  justify-content: flex-end;
}

.ov-merchant-confirm {
  background: #5a7a3c;
  color: #f0e6cc;
  border: 2px solid #3a5a2e;
  border-radius: 8px;
  padding: 9px 18px;
  font-weight: 800;
  font-size: 14px;
}

.ov-merchant-confirm:disabled { opacity: .4; }

.ov-merchant-flash {
  position: absolute;
  top: 54px;
  left: 50%;
  transform: translateX(-50%);
  background: #3a5a2e;
  color: #f0e6cc;
  padding: 8px 16px;
  border-radius: 8px;
  font-size: 13px;
  font-weight: 700;
  box-shadow: 0 2px 8px rgba(0,0,0,.35);
  z-index: 25;
  animation: ov-merchant-flash-fade 2.2s ease forwards;
}

@keyframes ov-merchant-flash-fade {
  0% { opacity: 0; transform: translate(-50%, -6px); }
  10% { opacity: 1; transform: translate(-50%, 0); }
  75% { opacity: 1; }
  100% { opacity: 0; }
}

.ov-labor-cell-label {
  font-size: 11px;
  color: #a89372;
  text-align: center;
}

.ov-labor-stepper {
  display: flex;
  align-items: center;
  gap: 6px;
}

.ov-labor-count {
  min-width: 40px;
  text-align: center;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 14px;
  font-variant-numeric: tabular-nums;
}

.ov-labor-shortage { color: #d9564a; }

.ov-labor-weapon-picker {
  display: flex;
  flex-wrap: wrap;
  gap: 3px;
  justify-content: center;
  max-width: 110px;
}

.ov-labor-weapon-btn {
  font-size: 9px;
  padding: 2px 5px;
  border-radius: 4px;
  background: #221c16;
  border: 1px solid #3a3128;
  color: #cbb98e;
}

.ov-labor-weapon-btn.selected {
  border-color: #c9a227;
  color: #e3bf4a;
}

.ov-labor-efficiency {
  font-size: 9px;
  color: #7a6c52;
}

/* The land. Panning is local only — cross-county travel goes through the
   minimap, per the spec, so this never becomes the primary way to get around. */
.ov-stage {
  /* NOT position: relative. The minimap is pinned to the screen rather than to
     the land, so its containing block must be .ov — which does not scroll. */
  flex: 1 1 auto;
  overflow: auto;
  background: #0d0b09;
  /* A PLAIN BLOCK scroll container, deliberately not a centring flex one.
     A centred flex item that overflows its scroller is unreachable at the top
     and left: the overflow is split to both sides and scrollLeft cannot go
     below zero, so the first county would be permanently half off-screen. The
     world always overflows, so there is nothing to centre anyway. */
  -webkit-overflow-scrolling: touch;
}

.ov-map {
  display: block;
  /* Width is set inline, from the world's column count, so ONE COUNTY fills
     the screen's width and the rest of the realm is scrolled to. Fitting the
     whole world here instead would shrink every tile below the tap floor —
     the map would fit, and nothing on it would be usable. */
  height: auto;
}

.ov-corner {
  position: absolute;
  top: 58px;
  right: 8px;
  padding: 4px;
  border-radius: 6px;
  background: rgba(13, 11, 9, 0.82);
  border: 1px solid #3a3128;
  line-height: 0;
}

.mm { display: block; }

.ov-strip {
  display: flex;
  flex-direction: column;
  gap: 5px;
  padding: 7px 9px calc(7px + env(safe-area-inset-bottom, 0px));
  background: var(--parchment-deep);
  background-image: radial-gradient(circle at 15% 0%, rgba(255, 255, 255, 0.16), transparent 60%);
  border-top: 3px solid #5a4525;
  flex: 0 0 auto;
}

/* Which county the camera is on. The strip's figures are per-county, and once
   the map covers the whole realm "whose numbers are these?" needs an answer. */
.ov-where {
  font-size: 13px;
  font-weight: 700;
  letter-spacing: 0.02em;
  margin-right: 1px;
  white-space: nowrap;
  color: var(--ink);
}

.ov-strip-pop {
  display: flex;
  align-items: center;
  gap: 4px;
  flex: 0 0 auto;
  background: var(--parchment);
  border: 1px solid var(--parchment-shadow);
  border-radius: 8px;
  padding: 3px 7px;
  font-size: 12px;
  color: var(--ink);
}

/* Per-resource chip for the bottom bar specifically — icon, a small colored
   delta, and the running stock stacked underneath, the same three-part
   readout the source itself uses (icon / colored delta / total beneath).
   Deliberately its own class rather than reusing `.ov-readout` (the pooled-
   treasury view and the labor screen both already depend on that one, and
   this needed a taller two-line internal layout that would have changed
   how those look too). */
.ov-strip-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--parchment);
  border: 1px solid var(--parchment-shadow);
  border-radius: 8px;
  padding: 3px 6px;
  flex: 1 1 0;
  min-width: 0;
  justify-content: center;
}

.ov-strip-chip img {
  width: 24px;
  height: 24px;
  flex: none;
  display: block;
}

.ov-strip-chip-stack {
  display: flex;
  flex-direction: column;
  align-items: flex-start;
  line-height: 1.05;
}

.ov-strip-chip-delta {
  font-size: 10px;
  font-weight: 700;
  color: #6b5d42;
}

.ov-strip-chip-delta.up { color: #3a6b2e; }
.ov-strip-chip-delta.down { color: #8c2f24; }

.ov-strip-chip-total {
  font-size: 14px;
  font-weight: 800;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Happiness/health, as plain icon+number chips with a tone-colored border —
   replaces the old fill-height thermometer (`.ov-gauge`, still used nowhere
   else, kept below only because deleting a shared-looking class name felt
   riskier than it needed to be tonight). A number the player already reads
   precisely elsewhere doesn't need a second, fuzzier encoding stacked on
   top of it. */
.ov-status-chip {
  display: flex;
  align-items: center;
  gap: 4px;
  background: var(--parchment);
  border: 2px solid var(--parchment-shadow);
  border-radius: 8px;
  padding: 3px 7px;
  flex: 0 0 auto;
}

.ov-status-chip[data-tone='green'] { border-color: #3a6b2e; }
.ov-status-chip[data-tone='amber'] { border-color: #b5811f; }
.ov-status-chip[data-tone='red'] { border-color: #8c2f24; }

.ov-status-chip-emoji { font-size: 15px; line-height: 1; }

.ov-status-chip-val {
  font-size: 13px;
  font-weight: 800;
  color: var(--ink);
  font-variant-numeric: tabular-nums;
}

/* Tax/ration steppers and the caravan/levy actions, scoped to the bottom
   bar so reworking this strip can never change how the same-looking
   controls behave on the labor screen (`.ov-stepper*`) — those stay
   exactly as they were. */
.ov-strip-stepper {
  display: flex;
  align-items: center;
  background: var(--parchment);
  border: 1px solid var(--parchment-shadow);
  border-radius: 8px;
  overflow: hidden;
  flex: 1 1 auto;
}

.ov-strip-stepper-btn {
  width: 24px;
  height: 28px;
  background: var(--parchment-dim);
  border: none;
  color: var(--ink);
  font-size: 14px;
  font-weight: 700;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.ov-strip-stepper-btn:disabled { opacity: .35; }

.ov-strip-stepper-label {
  flex: 1;
  text-align: center;
  font-size: 11px;
  font-weight: 700;
  color: var(--ink);
  white-space: nowrap;
  padding: 0 4px;
}

.ov-strip-icon-btn {
  width: 30px;
  height: 30px;
  border-radius: 8px;
  background: var(--parchment);
  border: 1px solid var(--parchment-shadow);
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 3px;
  flex: none;
}

.ov-strip-icon-btn img { width: 100%; height: 100%; object-fit: contain; }
.ov-strip-icon-btn:disabled { opacity: .35; }

/* Thermometer, kept from v1 for anywhere else that still wants a fill-height
   gauge — the bottom bar itself no longer uses this (see `.ov-status-chip`
   above). */
.ov-gauge-wrap {
  display: flex;
  flex-direction: column;
  align-items: center;
  gap: 2px;
}

.ov-gauge-label {
  font-size: 9px;
  letter-spacing: 0.03em;
  color: #a89372;
  text-transform: uppercase;
}

.ov-gauge {
  width: 16px;
  height: 40px;
  border-radius: 8px;
  background: #221c16;
  border: 1px solid #3a3128;
  display: flex;
  align-items: flex-end;
  overflow: hidden;
}

.ov-gauge-fill {
  width: 100%;
  background: #8fc06a;
  transition: height 160ms ease;
}

.ov-gauge-fill[data-tone='amber'] { background: #d4a24f; }
.ov-gauge-fill[data-tone='red'] { background: #b8443a; }

/* Tax/ration steppers — small –/+ chips flanking a label, same chip visual
   language as the rest of the strip rather than a new control style. */
.ov-stepper {
  display: flex;
  align-items: center;
  gap: 4px;
  font-size: 11px;
  white-space: nowrap;
}

.ov-stepper-btn {
  width: 22px;
  height: 22px;
  border-radius: 6px;
  background: #221c16;
  border: 1px solid #3a3128;
  color: #e8dcc0;
  font-size: 13px;
  line-height: 1;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 0;
}

.ov-stepper-btn:disabled { opacity: .35; }
.ov-stepper-label { min-width: 44px; text-align: center; color: #cbb98e; }

.ov-strip-row {
  display: flex;
  align-items: center;
  gap: 5px;
  width: 100%;
}

/* ---------------------------------------------------------------------------
   Castle ladder preview (dev page). Deleted with castles.html when the castle
   build screen replaces it.
   --------------------------------------------------------------------------- */

.tiers {
  padding: 22px 20px 30px;
  background: #0d0b09;
  color: #e8dcc0;
  min-height: 100vh;
}

.tiers-head {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 24px;
  margin: 0 0 4px;
}

.tiers-sub {
  margin: 0 0 22px;
  color: #a4906c;
  font-size: 13px;
  max-width: 60ch;
}

.tiers-row {
  display: flex;
  gap: 18px;
  align-items: flex-start;
}

.tier {
  width: 190px;
  flex: 0 0 auto;
}

/* The plot is the point: real ground, real scale, no frame around it that
   would flatter the sprite. */
.tier-plot {
  display: block;
  border-radius: 4px;
  margin-bottom: 8px;
}

.tier-rank {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 11px;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: #8a7a5e;
}

.tier-name {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 17px;
  margin-bottom: 4px;
}

.tier-blurb {
  margin: 0 0 8px;
  font-size: 12px;
  line-height: 1.45;
  color: #bfae8a;
  min-height: 52px;
}

.tier-cost {
  display: flex;
  flex-wrap: wrap;
  gap: 4px;
  margin-bottom: 8px;
}

.tier-free {
  display: inline-block;
  margin-bottom: 8px;
  font-size: 12px;
  color: #8a7a5e;
}

.tier-stats {
  display: flex;
  flex-direction: column;
  gap: 2px;
  font-size: 12px;
  color: #bfae8a;
}

.tier-stats b {
  color: #e8dcc0;
  font-family: 'SF Mono', Menlo, Consolas, monospace;
}

/* ---------------------------------------------------------------------------
   Army token preview (dev page).
   --------------------------------------------------------------------------- */

.armies-grid {
  display: flex;
  gap: 26px;
  flex-wrap: wrap;
  margin-bottom: 12px;
}

.armies-seat-name {
  display: flex;
  align-items: center;
  gap: 7px;
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 15px;
  margin-bottom: 6px;
}

.armies-swatch {
  width: 14px;
  height: 14px;
  border-radius: 3px;
  border: 1px solid #5c5344;
}

.armies-sizes {
  display: flex;
  gap: 8px;
}

.armies-label {
  font-family: 'SF Mono', Menlo, Consolas, monospace;
  font-size: 10px;
  color: #8a7a5e;
  text-align: center;
  margin-top: 2px;
}

.armies-vision {
  font-family: 'Iowan Old Style', Georgia, serif;
  font-size: 18px;
  margin: 26px 0 2px;
}

/* Applied to a copy of the same markup, so what is being checked is the real
   sprites rather than a mock-up that could disagree with them. */
.vision-grey {
  filter: grayscale(1);
}

.vision-deut {
  filter: url(#deuteranopia);
}

/* ------------------------------------------------- standalone playtest ---- */
/* Only the one-file handoff build uses these — see src/standalone.tsx. They
   are here rather than inline so the build has no second stylesheet to inline
   and the "one file, no external requests" rule stays trivially true. */

/* ------------------------------------------------ town-centre labor view --- */
/* The framed land inset plus its rail. Parchment and ink, not LOTR2's
   red-and-gold, but the same composition: a bordered piece of the county's own
   ground with the workforce on it, and the readouts kept beside it so the land
   stays uncluttered. */

.ov-town {
  display: flex;
  gap: 14px;
  align-items: flex-start;
  padding: 12px 14px 18px;
  overflow-y: auto;
}

.ov-town-left { flex: 1 1 auto; min-width: 0; }

.ov-plan-frame {
  /* The ornate border of the references, rebuilt from this game's own
     materials: a double rule in aged gold over ink, rather than a bitmap
     frame that would have to be redrawn at every size. */
  border: 3px solid #6b5836;
  outline: 1px solid #2a231c;
  outline-offset: 3px;
  border-radius: 2px;
  background: #4f7a3a;
  box-shadow: inset 0 0 0 2px #97803f, 0 6px 18px rgb(0 0 0 / 0.45);
  padding: 3px;
}

.ov-plan { display: block; width: 100%; height: auto; }

.ov-idle-pill {
  display: inline-block;
  margin-bottom: 8px;
  padding: 4px 12px;
  border-radius: 999px;
  border: 1px solid #4a3f31;
  background: rgb(201 162 39 / 0.12);
  color: #e3bf4a;
  font-size: 12px;
  letter-spacing: 0.04em;
}

.ov-town-warn {
  margin: 0 0 8px;
  padding: 5px 10px;
  border-left: 3px solid #c0392b;
  background: rgb(192 57 43 / 0.14);
  color: #e8c9c3;
  font-size: 12px;
}

.ov-town-hint {
  margin: 10px 2px 0;
  font-size: 12px;
  font-style: italic;
  color: #a4906c;
}

.ov-town-stepper {
  margin-top: 10px;
  padding: 10px 12px;
  border: 1px solid #2a231c;
  border-radius: 4px;
  background: linear-gradient(180deg, #191410, #120f0c);
}

.ov-town-stepper-name {
  display: flex;
  justify-content: space-between;
  align-items: baseline;
  gap: 10px;
  margin-bottom: 8px;
  color: #e8dcc0;
  font-size: 14px;
}

.ov-town-eff { font-size: 11px; color: #a4906c; }

.ov-town-stepper-ctl { display: flex; align-items: center; gap: 14px; }

.ov-town-btn {
  width: 46px;
  height: 46px;           /* comfortably over the 44pt tap floor */
  border-radius: 4px;
  border: 1px solid #c9a227;
  background: rgb(201 162 39 / 0.12);
  color: #e3bf4a;
  font-size: 22px;
  line-height: 1;
}
.ov-town-btn:disabled { opacity: 0.32; border-color: #4a3f31; color: #6b5c46; }

.ov-town-count {
  min-width: 3ch;
  text-align: center;
  font-family: var(--numeric, monospace);
  font-size: 20px;
  color: #e8dcc0;
}

.ov-town-note { margin: 8px 0 0; font-size: 11px; color: #a4906c; font-style: italic; }

.ov-town-rail {
  flex: 0 0 168px;
  display: flex;
  flex-direction: column;
  gap: 8px;
  padding: 10px;
  border: 1px solid #2a231c;
  border-radius: 4px;
  background: linear-gradient(180deg, #1b1611, #14100c);
}

.ov-town-name {
  font-size: 17px;
  color: #e8dcc0;
  text-align: center;
  border-bottom: 1px solid #2a231c;
  padding-bottom: 6px;
}

.ov-town-vitals { display: flex; gap: 8px; }

.ov-town-vital {
  flex: 1 1 0;
  display: flex;
  flex-direction: column;
  align-items: center;
  padding: 5px 2px;
  border: 1px solid #2a231c;
  border-radius: 3px;
  background: #17130f;
}

.ov-town-vital-k {
  font-size: 9px;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: #a4906c;
}

.ov-town-vital-v { font-family: var(--numeric, monospace); font-size: 15px; color: #e8dcc0; }

.ov-town-alloc {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 6px;
  padding: 6px 8px;
  border: 1px solid #2a231c;
  border-radius: 3px;
  background: #17130f;
  font-size: 10px;
  color: #a4906c;
  letter-spacing: 0.08em;
  text-transform: uppercase;
}

.ov-town-alloc-mid {
  font-family: var(--numeric, monospace);
  font-size: 13px;
  color: #e3bf4a;
  text-transform: none;
  letter-spacing: 0;
}

/* On a phone the rail goes under the land rather than beside it — 168px of
   side rail would squeeze the inset to something nobody can tap. */
@media (max-width: 720px) {
  .ov-town { flex-direction: column; }
  /* Stretch, not flex-start. Once the axis flips to column, flex-start becomes
     a CROSS-axis rule and shrinks both children to their content width — which
     left the map using 300px of a 414px phone and shrank every tap target with
     it. The land should have the whole screen. */
  .ov-town { align-items: stretch; }
  .ov-town-rail { flex: 0 0 auto; width: 100%; }
}
</style>
</head>

* on-screen steppers. Row 1 is identity + status (name, happiness, health);
* row 2 is everything actionable (production, tax, rations, the two
* existing buttons). Each row scrolls horizontally on its own rather than
* the whole footer, so a long row on a narrow phone doesn't compress the
* short one.
*/
/**
* The labor allocation screen — the fine-grained "advanced panel" a player
* opens by tapping a county's town centre. The bottom strip's agriculture/
* industry slider (`setLabourSplit`) is the coarse control; this is the
* precise one, one slot at a time, gated by the unemployed labor pool so
* a slot can't gain workers no other slot is giving up.
*
* Grain and cattle are the only two cells that can show a red shortage
* number — per spec, every other slot just displays its plain worker count
* in the ordinary text color, however large. "Required" for grain is the
* labor to plant every grain field to the full 10-sack cap (`60/field`),
* not just to sustain whatever's already planted — the screen is meant to
* show what full capacity would take, not merely validate the status quo.
* "Required" for cattle is the 1:2 ratio that merely maintains a herd
* (LOTR2's own baseline), so a county below that is actively going to
* watch its herd shrink, not just miss out on optimal growth.
*/
// ---------------------------------------------------------------------------
// THE TOWN-CENTER LABOR VIEW
//
// Replaces the icon-card grid. This is LOTR2's town-center screen: one framed
// piece of the county's own land with the workforce standing on it, every job
// visible and adjustable without leaving the screen.
//
// It is NOT the county view. The living map shows land and armies and never
// shows labourers; this screen is a condensed, abstracted plan built purely for
// allocating them. That separation is deliberate — scattering figures across
// the real 7x19 interior would put them where nobody is looking and make the
// county unreadable.
//
// WHY THERE IS EMPTY GROUND. About a third of the inset is deliberately slack:
// plain grass, trees, a pond, a cart track. Every LOTR2 reference has it, and
// it is what makes the box read as countryside instead of a dashboard. It also
// does the real work of drawing the eye — the labourers are the only figures on
// otherwise quiet ground, so they are found instantly. Plots therefore keep a
// fixed size and a county with fewer work sites gets MORE open ground, rather
// than plots stretching to fill the frame.
// ---------------------------------------------------------------------------

/** Deterministic per-plot jitter. Stable across renders — see scatter(). */
function plotRng(seed) {
	let a = 0;
	for (let i = 0; i < seed.length; i++) a = (a * 31 + seed.charCodeAt(i)) | 0;
	return () => {
		a |= 0;
		a = (a + 1831565813) | 0;
		let t = Math.imul(a ^ (a >>> 15), 1 | a);
		t = (t + Math.imul(t ^ (t >>> 7), 61 | t)) ^ t;
		return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
	};
}

/**
 * Where a plot's figures stand.
 *
 * LOOSE IRREGULAR KNOTS, not rows. Confirmed against every LOTR2 reference:
 * the cattle sit in a rough grid, the people never do. A tidy row reads as a UI
 * widget; a knot reads as people standing in a field.
 *
 * Seeded from the plot key so the arrangement is IDENTICAL on every render.
 * Re-rolling per render would make the whole workforce twitch each time a
 * counter changed, which looks like a bug and is exhausting to watch.
 */
function scatter(key, count, w, h) {
	const rand = plotRng(key);
	const spots = [];
	for (let i = 0; i < count; i++) {
		spots.push({
			x: 8 + rand() * Math.max(1, w - 24),
			y: 10 + rand() * Math.max(1, h - 26),
		});
	}
	// Painter's order, so a figure lower in the plot overlaps one behind it.
	return spots.sort((p, q) => p.y - q.y);
}

/**
 * How many figures to draw for N workers.
 *
 * A DENSITY SIGNAL, NOT A COUNT. Sixty workers cannot be sixty legible sprites
 * in a 92px plot, and trying would turn the plot into a smear. The exact number
 * is on the stepper for anyone who wants it; the crowd only has to say "busy"
 * or "nearly empty" at a glance.
 */
function figureCount(workers, staffed) {
	if (workers <= 0) return 0;
	if (!staffed) return Math.min(3, Math.max(1, Math.round(workers / 20)));
	const share = Math.max(0, Math.min(1, workers / staffed));
	return Math.max(1, Math.min(8, Math.round(3 + share * 5)));
}

/**
 * A THREE-BY-THREE RING AROUND THE TOWN.
 *
 * The reference mockups are all built the same way: a cottage at the middle of
 * a dirt crossroads with the work laid out around it. That is why the town is
 * not in this list — it owns the centre cell permanently, and the eight slots
 * here are the ring, in reading order. It is also where the idle peasants
 * stand, which is what makes "how many are doing nothing" the thing you see
 * first without hunting for it.
 *
 * Plots butt right up against each other with no gap. In the mockups the county
 * is continuous ground — one field's fence is the next field's edge — and the
 * gaps I had before were what made the earlier build read as cards on a lawn
 * rather than as land.
 */
const PLOT_W = 108;
const PLOT_H = 82;
const PLAN_W = PLOT_W * 3;
const PLAN_H = PLOT_H * 3;
const PLOT_SLOTS = [
	{ x: 0, y: 0 }, { x: PLOT_W, y: 0 }, { x: PLOT_W * 2, y: 0 },
	{ x: 0, y: PLOT_H }, /* centre = town */ { x: PLOT_W * 2, y: PLOT_H },
	{ x: 0, y: PLOT_H * 2 }, { x: PLOT_W, y: PLOT_H * 2 }, { x: PLOT_W * 2, y: PLOT_H * 2 },
];
/** The centre cell. The town sits here and never moves. */
const TOWN_SLOT = { x: PLOT_W, y: PLOT_H };

/**
 * The county's work, as plots.
 *
 * Sites the county does not have are OMITTED, not greyed out. On a map you do
 * not draw a quarry that is not there — an empty cell labelled "no quarry" is
 * list thinking, and this is supposed to be land.
 */
function planPlots(county, ctx) {
	const { quarryOrMine, blacksmith, lumberMill, grainRequired, cattleRequired, grainFields, cattleFields } = ctx;
	const out = [];

	out.push({
		key: "farm", slot: "farm", label: "Grain", job: "farmer",
		workers: county.farmWorkers, required: grainFields.length ? grainRequired : 0,
		// Ripe gold once there is a crop worth seeing, young shoots before —
		// this is the yellow strip the references all open on.
		art: overheadFieldArt("grain", grainFields.length ? "mature" : "growing"), tiled: true,
		current: county.farmWorkers, efficiency: county.grainEfficiency,
	});
	out.push({
		key: "cattle", slot: "cattle", label: "Pasture", job: "herder",
		workers: county.cattleWorkers, required: cattleFields.length ? cattleRequired : 0,
		art: overheadFieldArt("cattle"), tiled: true,
		current: county.cattleWorkers, efficiency: county.cattleEfficiency,
	});
	if (quarryOrMine) {
		out.push({
			key: quarryOrMine.kind, slot: quarryOrMine.kind,
			label: quarryOrMine.kind === "quarry" ? "Quarry" : "Mine", job: "miner",
			workers: quarryOrMine.workers ?? 0, required: 0,
			building: overheadIndustryArt(quarryOrMine.kind),
			// The barren tile as the pit floor. It has always read as bare
			// stone, which was wrong for a FIELD and is exactly right here.
			art: overheadFieldArt("barren"), tiled: true,
			current: quarryOrMine.workers ?? 0, efficiency: quarryOrMine.efficiency,
		});
	}
	if (lumberMill) {
		out.push({
			key: "lumberMill", slot: "lumberMill", label: "Lumber", job: "woodcutter",
			workers: lumberMill.workers ?? 0, required: 0,
			building: overheadIndustryArt("lumberMill"),
			art: overheadFieldArt("fallow"), tiled: true,
			current: lumberMill.workers ?? 0, efficiency: lumberMill.efficiency,
		});
	}
	if (blacksmith) {
		out.push({
			key: "blacksmith", slot: "blacksmith", label: "Forge", job: "blacksmith",
			workers: blacksmith.workers ?? 0, required: 0,
			building: overheadIndustryArt("blacksmith"),
			art: overheadFieldArt("fallow"), tiled: true,
			current: blacksmith.workers ?? 0, efficiency: blacksmith.efficiency,
		});
	}
	out.push({
		key: "repair", slot: "repair", label: "Repair", job: "farmer",
		workers: county.repairWorkers, required: 0,
		art: overheadFieldArt("fallow"), tiled: true,
		current: county.repairWorkers,
	});
	out.push({
		key: "castle", slot: "castle",
		label: county.building ? `Building ${county.building.seasonsLeft}` : "Castle",
		// No mason sprite exists yet, so the farmer stands in rather than the
		// blacksmith doing double duty across two plots — reusing the forge's
		// own figure on the castle would read as the smith having moved.
		job: "farmer",
		workers: county.castleWorkers, required: 0,
		building: overheadCastleArt(county.building ? county.building.tier : county.castleTier),
		art: overheadFieldArt("fallow"), tiled: true,
		locked: !county.building,
		current: county.castleWorkers,
	});
	return out;
}

/** The framed inset: land, workers, and the taps that adjust them. */
function TownPlan({ plots, idle, selected, onSelect, seat }) {
	const h = import_react.createElement;
	const grass = overheadGroundArt("ground");
	const forest = overheadForestArt();
	const town = overheadTownArt();

	const nodes = [];
	// Grass under everything, as a repeating pattern.
	nodes.push(h("rect", { key: "bg", x: 0, y: 0, width: PLAN_W, height: PLAN_H, fill: "url(#tp-grass)" }));

	// THE CROSSROADS, in real road art rather than a drawn line.
	//
	// Every reference is organised around a dirt crossing with the cottage at
	// the middle, and the roads are what tie the plots into one place instead of
	// a grid of squares that happen to touch.
	//
	// Drawn as a LANE tiled at the art's own size, not one tile stretched over a
	// whole plot. Stretching it produced a smeared tan slab that read as a field
	// of mud rather than a track — a road is recognisable because of its width
	// relative to the land, and scaling destroys exactly that.
	const LANE = 32;
	const midX = PLOT_W + PLOT_W / 2 - LANE / 2;
	const midY = PLOT_H + PLOT_H / 2 - LANE / 2;
	// Edge bits, matching roadMasks above: N=1 E=2 S=4 W=8. Spelled out because
	// the bundler inlined the shared constants as literals, and a bare 10 in an
	// art lookup is unreadable six months from now.
	const RN = 1, RE = 2, RS = 4, RW = 8;
	const ewArt = overheadRoadArt(RE | RW);
	const nsArt = overheadRoadArt(RN | RS);
	const xArt = overheadRoadArt(RN | RE | RS | RW);
	const lane = [];
	if (!ewArt.missing) {
		for (let x = 0; x < PLAN_W; x += LANE) {
			lane.push(h("image", {
				key: `ew${x}`, href: ewArt.url, x, y: midY, width: LANE, height: LANE,
				style: { imageRendering: "pixelated" },
			}));
		}
	}
	if (!nsArt.missing) {
		for (let y = 0; y < PLAN_H; y += LANE) {
			lane.push(h("image", {
				key: `ns${y}`, href: nsArt.url, x: midX, y, width: LANE, height: LANE,
				style: { imageRendering: "pixelated" },
			}));
		}
	}
	if (!xArt.missing) {
		lane.push(h("image", {
			key: "x", href: xArt.url, x: midX, y: midY, width: LANE, height: LANE,
			style: { imageRendering: "pixelated" },
		}));
	}
	nodes.push(h("g", { key: "lane" }, lane));

	plots.forEach((plot, i) => {
		const s = PLOT_SLOTS[i];
		if (!s) return;
		const kids = [];

		if (plot.tiled && plot.art && !plot.art.missing) {
			// Laid on the same grid the living map uses — 32 across, 23 down —
			// and drawn at the art's natural size so nothing is stretched. The
			// overhang past the plot edge is clipped, which is what lets the
			// rows overlap their depth bands the way the camera intends.
			const tiles = [];
			for (let ty = 0; ty < 3; ty++) {
				for (let tx = 0; tx < 3; tx++) {
					tiles.push(h("image", {
						key: `t${tx}_${ty}`, href: plot.art.url,
						x: tx * 32, y: ty * 23, width: 32, height: 32,
						style: { imageRendering: "pixelated" },
					}));
				}
			}
			kids.push(h("g", { key: "tiles", clipPath: `url(#tp-clip-${plot.key})` }, tiles));
		}
		// The building stands ON its ground rather than in place of it — a forge
		// on bare grass was the giveaway that these were cards, not land.
		if (plot.building && !plot.building.missing) {
			kids.push(h("image", {
				key: "b", href: plot.building.url,
				x: PLOT_W / 2 - 28, y: 4, width: 56, height: 56,
				style: { imageRendering: "pixelated" },
			}));
		}

		// The staffing ring, on the ground itself rather than round a card.
		// Only where the model actually knows what "enough" means: grain and
		// cattle have a required figure, industry has none, and inventing one
		// would be a number the game does not believe.
		let ring = null;
		if (plot.required > 0) {
			if (plot.workers < plot.required) ring = "#c0392b";
			else if (plot.workers > plot.required * 1.35) ring = "#2f6fd0";
		}

		const figures = figureCount(plot.workers, plot.required);
		const spots = scatter(plot.key, figures, PLOT_W, PLOT_H);
		const art = laborerArt(plot.job);
		if (!art.missing) {
			spots.forEach((p, n) => kids.push(h("image", {
				key: `f${n}`, href: art.url,
				x: p.x, y: p.y, width: 23, height: 23,
				style: { imageRendering: "pixelated" },
			})));
		}

		kids.push(h("rect", {
			key: "ring", x: 0.5, y: 0.5, width: PLOT_W - 1, height: PLOT_H - 1,
			fill: "none", rx: 3,
			stroke: selected === plot.slot ? "#e3bf4a" : ring || "transparent",
			strokeWidth: selected === plot.slot ? 3 : 2,
		}));
		kids.push(h("title", { key: "ttl" }, `${plot.label} — ${plot.workers} workers`));

		nodes.push(h("g", {
			key: plot.key,
			transform: `translate(${s.x} ${s.y})`,
			style: { cursor: plot.locked ? "default" : "pointer" },
			onClick: () => onSelect(plot.slot === selected ? null : plot.slot),
		}, kids));

		// The label PLATE, not loose text. Every reference hangs a small banner
		// over its plot, and it is what keeps the name legible over ploughed
		// soil, bare rock and grass alike — plain text has to survive whatever
		// is under it, and over the quarry floor it did not.
		const plate = `${plot.label} ${plot.workers}`;
		const pw = plate.length * 6.2 + 14;
		const px0 = s.x + PLOT_W / 2 - pw / 2;
		const py0 = s.y + PLOT_H - 19;
		const tone = selected === plot.slot
			? { fill: "#5a4410", stroke: "#e3bf4a" }        // picked up
			: ring === "#c0392b"
				? { fill: "#5e1a14", stroke: "#e8b0a6" }      // short-handed
				: plot.workers === 0
					? { fill: "#2b2620", stroke: "#6b5c46" }    // nobody on it
					: { fill: "#3a2f22", stroke: "#c9b48a" };
		nodes.push(h("g", { key: `${plot.key}-lbl`, pointerEvents: "none" }, [
			h("rect", {
				key: "p", x: px0, y: py0, width: pw, height: 17, rx: 2,
				fill: tone.fill, stroke: tone.stroke, strokeWidth: 1.5, opacity: 0.96,
			}),
			h("text", {
				key: "t", x: s.x + PLOT_W / 2, y: py0 + 12.5,
				textAnchor: "middle", fill: "#f2e8d0", fontSize: 11,
				style: { fontWeight: 600, paintOrder: "stroke", stroke: "rgba(0,0,0,.55)", strokeWidth: 2.5 },
			}, plate),
		]));
	});

	// THE SETTLEMENT AT THE CENTRE, where the roads cross.
	//
	// Fixed, not the next free slot. The references all put the cottage in the
	// middle of the crossing with people milling round it, and that is also
	// where the idle pool belongs — the workforce doing nothing should be the
	// first thing the eye lands on, not something to hunt for in a corner.
	const ts = TOWN_SLOT;
	const idleKids = [];
	if (!town.missing) {
		idleKids.push(h("image", {
			key: "town", href: town.url, x: PLOT_W / 2 - 30, y: -4,
			width: 60, height: 60, style: { imageRendering: "pixelated" },
		}));
	}
	const idleArt = laborerArt("idle");
	if (!idleArt.missing && idle > 0) {
		// Gathered round the cottage rather than spread over the whole cell, so
		// they read as a crowd waiting for work instead of as another staffed plot.
		scatter("idle", Math.min(7, Math.max(2, Math.round(idle / 20))), PLOT_W - 30, PLOT_H - 34)
			.forEach((p, n) => idleKids.push(h("image", {
				key: `i${n}`, href: idleArt.url, x: p.x + 15, y: p.y + 24, width: 19, height: 19,
				// GHOSTED, never blue. Azure is seat 1's colour on this map, so a
				// blue peasant would read as "Aldric's man" rather than "idle".
				style: { imageRendering: "pixelated", filter: "grayscale(1)", opacity: 0.55 },
			})));
	}
	nodes.push(h("g", { key: "town", transform: `translate(${ts.x} ${ts.y})` }, idleKids));

	// Scenery in the leftover ring slots. The centre is never one of them — the
	// town owns it — so this can walk the ring freely.
	for (let i = plots.length; i < PLOT_SLOTS.length; i++) {
		const s = PLOT_SLOTS[i];
		if (!s || forest.missing) continue;
		const rand = plotRng(`scenery${i}`);
		const trees = [];
		for (let n = 0; n < 3; n++) {
			trees.push(h("image", {
				key: n, href: forest.url,
				x: rand() * (PLOT_W - 34), y: rand() * (PLOT_H - 34),
				width: 34, height: 34, style: { imageRendering: "pixelated" },
			}));
		}
		nodes.push(h("g", { key: `sc${i}`, transform: `translate(${s.x} ${s.y})`, opacity: 0.9 }, trees));
	}

	return h("div", { className: "ov-plan-frame" },
		h("svg", {
			className: "ov-plan", viewBox: `0 0 ${PLAN_W} ${PLAN_H}`,
			role: "group", "aria-label": "County labor plan",
		}, [
			h("defs", { key: "defs" }, [
				...plots.filter((p) => p.tiled).map((p) => h("clipPath", { key: p.key, id: `tp-clip-${p.key}` },
					h("rect", { width: PLOT_W, height: PLOT_H, rx: 3 }))),
				h("pattern", {
					// 32 wide by the camera's STRIDE, not the tile's full height.
					// A tile canvas is 32x32 but only the top 23px is the ground
					// face; the rest is the depth band meant to be overlapped by
					// the row in front. Tiling at full height instead repeats
					// that band and turns plain grass into brown corduroy — which
					// is exactly what the first render looked like.
					id: "tp-grass", width: 32, height: 23, patternUnits: "userSpaceOnUse",
				}, grass.missing ? h("rect", { width: 32, height: 23, fill: "#6f9a4e" })
					: h("image", { href: grass.url, width: 32, height: 32, style: { imageRendering: "pixelated" } })),
			]),
			...nodes,
		]));
}

function LaborScreen({ match, countyId, countyName, onChange, onClose }) {
	const county = match.counties[countyId];
	if (!county) return null;
	const grainFields = county.interior.fields.filter((f) => f.status === "grain");
	const cattleFields = county.interior.fields.filter((f) => f.status === "cattle");
	const totalHerd = cattleFields.reduce((sum, f) => sum + f.herd, 0);
	const grainRequired = grainFields.length * MAX_SACKS_PER_FIELD * LABORERS_PER_SACK;
	const cattleRequired = Math.ceil(totalHerd / 2);
	const unemployed = unemployedWorkersOf(county);
	const quarryOrMine = county.interior.industry.find((s) => s.kind === "quarry" || s.kind === "mine");
	const blacksmith = county.interior.industry.find((s) => s.kind === "blacksmith");
	const lumberMill = county.interior.industry.find((s) => s.kind === "lumberMill");
	const you = match.players[0];
	const owned = you && county.owner === you.id;
	const STEP = 10;
	const adjustSlot = (slot, current, delta) => {
		if (!onChange) return;
		const result = setWorkerAllocation(match, countyId, slot, Math.max(0, current + delta));
		if (result.ok) onChange(result.match);
	};
	const pickWeapon = (weapon) => {
		if (!onChange) return;
		const result = setBlacksmithWeapon(match, countyId, weapon);
		if (result.ok) onChange(result.match);
	};
	const seat = match.players.findIndex((p) => p.id === county.owner);
	const [selected, setSelected] = import_react.useState(null);
	const h = import_react.createElement;

	const plots = planPlots(county, {
		quarryOrMine, blacksmith, lumberMill,
		grainRequired, cattleRequired, grainFields, cattleFields,
	});
	const chosen = plots.find((p) => p.slot === selected) || null;

	/**
	 * The badge is for CONSEQUENCE, not for redness.
	 *
	 * Every understaffed plot already says so with a red ring. A warning that
	 * fires on all of them at once is noise the eye learns to skip, so it is
	 * raised only where being short actually costs something this season: grain
	 * standing mature in the field with nobody bringing it in.
	 */
	const harvestAtRisk = grainFields.some((f) => grainStage(f.seasonsGrown) === "mature")
		&& county.farmWorkers < grainRequired;

	return h("div", { className: "ov-labor-overlay" }, [
		h("div", { className: "ov-labor-header", key: "hd" }, [
			h("h2", { key: "t" }, `${countyName ?? countyId} — Town Centre`),
			h("button", { key: "x", className: "ov-labor-close", onClick: onClose }, "✕"),
		]),

		h("div", { className: "ov-town", key: "body" }, [
			h("div", { className: "ov-town-left", key: "left" }, [
				h("div", { className: "ov-idle-pill", key: "pill" },
					`${unemployed} idle peasant${unemployed === 1 ? "" : "s"}`),
				harvestAtRisk ? h("div", { className: "ov-town-warn", key: "warn" },
					"❗ Grain is ripe and nobody is harvesting it") : null,
				h(TownPlan, {
					key: "plan", plots, idle: unemployed, selected, seat,
					onSelect: (slot) => setSelected(slot),
				}),
				chosen ? h("div", { className: "ov-town-stepper", key: "step" }, [
					h("div", { className: "ov-town-stepper-name", key: "n" }, [
						h("strong", { key: "l" }, chosen.label),
						chosen.efficiency != null
							? h("span", { key: "e", className: "ov-town-eff" },
								`${Math.round(chosen.efficiency * 100)}% efficient`)
							: null,
					]),
					h("div", { className: "ov-town-stepper-ctl", key: "c" }, [
						h("button", {
							key: "-", className: "ov-town-btn",
							disabled: !owned || chosen.locked || chosen.current <= 0,
							onClick: () => adjustSlot(chosen.slot, chosen.current, -STEP),
						}, "−"),
						h("span", { key: "v", className: "ov-town-count" }, chosen.current),
						h("button", {
							key: "+", className: "ov-town-btn",
							disabled: !owned || chosen.locked || unemployed < STEP,
							onClick: () => adjustSlot(chosen.slot, chosen.current, STEP),
						}, "+"),
					]),
					chosen.locked ? h("p", { className: "ov-town-note", key: "lk" },
						"Nothing is being built — start a castle to assign builders.") : null,
					chosen.slot === "blacksmith" && blacksmith && owned
						? h("div", { className: "ov-labor-weapon-picker", key: "w" },
